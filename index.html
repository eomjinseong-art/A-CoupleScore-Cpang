<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그날의 남녀 - 커플 솔루션 마켓</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 pb-24">

  <!-- 1. 최상단 배너 (아브아르) -->
  <div class="bg-rose-500 text-white text-xs font-semibold py-2 px-4 text-center sticky top-0 z-50 shadow-md">
    <a id="topBannerLink" href="https://www.avoir24.com" target="_blank" class="hover:underline flex items-center justify-center gap-1">
      <span>남친 심쿵하게 만드는 데이트룩 👗 아브아르 바로가기</span> <i class="fa-solid fa-chevron-right text-[10px]"></i>
    </a>
  </div>

  <!-- 2. 헤더 (상단 오른쪽 유튜브, 블로그, 관계진단) -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-[32px] z-40 shadow-sm">
    <h1 class="font-bold text-lg text-rose-600 flex items-center gap-1.5">
      <i class="fa-solid fa-heart"></i> 그날의 남녀 <span class="text-xs font-normal text-slate-400">Market</span>
    </h1>
    <div class="flex items-center gap-2.5 text-sm">
      <a href="https://www.youtube.com/@SpillEnglish-j9b" target="_blank" class="text-red-500 hover:opacity-80" title="유튜브"><i class="fa-brands fa-youtube text-lg"></i></a>
      <a href="https://couplescore-auto.blogspot.com/" target="_blank" class="text-orange-500 hover:opacity-80" title="블로그"><i class="fa-solid fa-blog text-lg"></i></a>
      <a href="https://couple-score.vercel.app/" target="_blank" class="bg-rose-500 text-white text-[11px] px-2.5 py-1 rounded-full font-bold shadow-sm hover:bg-rose-600">관계진단</a>
    </div>
  </header>

  <!-- 3. 카테고리 필터 바 -->
  <nav class="bg-white px-4 py-2.5 border-b border-slate-200 overflow-x-auto whitespace-nowrap flex gap-2 text-xs font-medium no-scrollbar">
    <button onclick="filterCategory('전체')" class="px-3 py-1.5 rounded-full bg-slate-900 text-white font-bold">전체보기</button>
    <button onclick="filterCategory('연락/카톡')" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-600">💖 화해/선물</button>
    <button onclick="filterCategory('데이트')" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-600">🏠 집데이트</button>
    <a href="https://www.avoir24.com" target="_blank" class="px-3 py-1.5 rounded-full bg-pink-100 text-pink-700 font-bold hover:bg-pink-200">👗 데이트룩/선물(아브아르)</a>
  </nav>

  <!-- 4. 메인 2열 상품 영역 -->
  <main class="max-w-md mx-auto p-3">
    <div id="productGrid" class="grid grid-cols-2 gap-3">
      <!-- 데이터 자동 생성 영역 -->
    </div>

    <!-- 중간 아브아르 배너 -->
    <div class="mt-4 bg-gradient-to-r from-pink-500 to-rose-500 text-white p-4 rounded-2xl shadow-sm text-center">
      <span class="text-[9px] bg-white/20 px-2 py-0.5 rounded font-bold uppercase">Sponsored</span>
      <h3 class="font-bold text-sm mt-1">화해 데이트 때 뭐 입지? ✨</h3>
      <p class="text-[11px] text-pink-100 mt-0.5">아브아르(AVOIR) 여성의류 감성 큐레이션</p>
      <a href="https://www.avoir24.com" target="_blank" class="mt-2 inline-block bg-white text-rose-600 text-xs font-bold px-3 py-1.5 rounded-lg shadow hover:bg-pink-50">
        아브아르 룩북 구경하기
      </a>
    </div>
  </main>

  <!-- 5. 하단 고정 바로가기 메뉴 바 (4개 버튼 직렬 나열) -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-2 z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1.5 text-center">
      <a href="https://www.youtube.com/@SpillEnglish-j9b" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 transition">
        <i class="fa-brands fa-youtube text-base mb-0.5"></i>
        <span class="text-[10px] font-bold">유튜브</span>
      </a>
      <a href="https://couplescore-auto.blogspot.com/" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-orange-50 text-orange-600 rounded-xl hover:bg-orange-100 transition">
        <i class="fa-solid fa-blog text-base mb-0.5"></i>
        <span class="text-[10px] font-bold">블로그</span>
      </a>
      <a href="https://www.threads.net/@couplescroe" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200 transition">
        <i class="fa-brands fa-threads text-base mb-0.5"></i>
        <span class="text-[10px] font-bold">스레드</span>
      </a>
      <a href="https://couple-score.vercel.app/" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition">
        <i class="fa-solid fa-heart-pulse text-base mb-0.5"></i>
        <span class="text-[10px] font-bold">관계진단</span>
      </a>
    </div>
  </footer>

  <!-- 6. 상세 모달 팝업 -->
  <div id="itemModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start">
        <span id="modalCategory" class="text-xs bg-rose-50 text-rose-600 font-bold px-2 py-0.5 rounded-full">#카테고리</span>
        <button onclick="closeModal()" class="text-slate-400 text-lg hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="bg-slate-100 rounded-xl p-4 text-center">
        <p id="modalTitle" class="font-bold text-sm text-slate-900">상품 제목</p>
        <p id="modalDesc" class="text-xs text-slate-500 mt-1">상품 설명</p>
      </div>

      <div class="bg-rose-50/70 p-3 rounded-xl border border-rose-100">
        <p class="font-bold text-xs text-rose-600 mb-1">💡 그날의 남녀 심리 팁</p>
        <p id="modalAdvice" class="text-xs text-slate-600 leading-relaxed">심리 코칭 내용</p>
      </div>

      <div class="pt-2 flex gap-2">
        <a id="modalCoupangBtn" href="#" target="_blank" class="flex-1 bg-rose-500 text-white text-center text-xs font-bold py-3 rounded-xl shadow-md hover:bg-rose-600">
          쿠팡에서 최저가로 보기 <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </a>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];

    async function loadData() {
      const paths = ['./data/counseling.json', './counseling.json', 'counseling.json'];
      let loaded = false;

      for (let path of paths) {
        try {
          let res = await fetch(path);
          if (res.ok) {
            allProducts = await res.json();
            renderProducts(allProducts);
            loaded = true;
            break;
          }
        } catch(e) {}
      }

      if (!loaded || allProducts.length === 0) {
        allProducts = [
          {
            category: "연락/카톡",
            topic: "치약",
            situation: "치약 짜는 문제로 싸웠을 때",
            psychologyAdvice: "상대방의 습관을 비난하기보다 치약 형태를 바꿔보는 것이 훨씬 평화롭습니다.",
            product: { title: "치약 추천 상품", description: "싸움 방지 및 관계 개선 필수 아이템", coupangUrl: "https://link.coupang.com/a/gJApa05FrU", imageUrl: "https://images.unsplash.com/photo-1559598467-f8b76c8155d0?w=500" }
          },
          {
            category: "연락/카톡",
            topic: "답장",
            situation: "답장이 늦어서 다퉜을 때",
            psychologyAdvice: "늦은 답장은 개인 몰입 중일 가능성이 높습니다. 내 감정을 부드럽게 전달하세요.",
            product: { title: "답장 추천 상품", description: "서로를 이해하는 커플 소통 아이템", coupangUrl: "https://link.coupang.com/a/gJAqET8o8q", imageUrl: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500" }
          }
        ];
        renderProducts(allProducts);
      }
    }

    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = items.map(item => {
        const title = item.product ? item.product.title : (item.topic + ' 추천 상품');
        const desc = item.product ? item.product.description : '싸움 방지 및 관계 개선 필수 아이템';
        const img = (item.product && item.product.imageUrl) ? item.product.imageUrl : 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500';

        return `
          <div onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between cursor-pointer hover:border-rose-300 transition">
            <div>
              <div class="relative">
                <img src="${img}" alt="상품" class="w-full h-32 object-cover">
                <span class="absolute top-2 left-2 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded font-medium backdrop-blur-sm">#${item.category || '커플'}</span>
              </div>
              <div class="p-2.5">
                <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${title}</h4>
                <p class="text-[10px] text-slate-500 line-clamp-1 mt-0.5">${desc}</p>
              </div>
            </div>
            <div class="p-2.5 pt-0">
              <button class="w-full bg-rose-50 text-rose-600 text-[10px] font-bold py-1.5 rounded-lg text-center hover:bg-rose-100">
                솔루션 보기
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCategory(cat) {
      if(cat === '전체') {
        renderProducts(allProducts);
      } else {
        const filtered = allProducts.filter(item => item.category === cat);
        renderProducts(filtered);
      }
    }

    function openModal(item) {
      const title = item.product ? item.product.title : (item.topic + ' 추천 상품');
      const desc = item.product ? item.product.description : '싸움 방지 필수 아이템';
      const url = item.product ? item.product.coupangUrl : 'https://www.coupang.com';

      document.getElementById('modalCategory').innerText = '#' + (item.category || '커플') + ' (' + (item.topic || '') + ')';
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('modalAdvice').innerText = item.psychologyAdvice || '상대방의 입장에서 한 번 더 생각해보세요.';
      document.getElementById('modalCoupangBtn').href = url;
      
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    loadData();
  </script>
</body>
</html>
