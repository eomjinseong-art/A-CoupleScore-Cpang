<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그날의 남녀 - 커플 솔루션 Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <!-- 상단 고정 광고 (아브아르) -->
  <div class="bg-rose-500 text-white text-xs font-semibold py-2 px-4 text-center sticky top-0 z-50 shadow-md">
    <a id="topBannerLink" href="#" target="_blank" class="hover:underline flex items-center justify-center gap-1">
      <span id="topBannerText">로딩 중...</span> <i class="fa-solid fa-chevron-right text-[10px]"></i>
    </a>
  </div>

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between sticky top-[32px] z-40 shadow-sm">
    <h1 class="font-bold text-lg text-rose-600 flex items-center gap-2">
      <i class="fa-solid fa-heart"></i> 그날의 남녀
    </h1>
    <div class="flex items-center gap-3 text-sm">
      <a id="youtubeBtn" href="#" target="_blank" class="text-red-500 hover:opacity-80" title="유튜브"><i class="fa-brands fa-youtube text-xl"></i></a>
      <a id="blogBtn" href="#" target="_blank" class="text-orange-500 hover:opacity-80" title="블로그"><i class="fa-solid fa-blog text-xl"></i></a>
      <a id="appBtn" href="#" target="_blank" class="bg-rose-500 text-white text-xs px-2.5 py-1.5 rounded-full font-bold shadow-sm hover:bg-rose-600">진단하기</a>
    </div>
  </header>

  <!-- 메인 히어로 영역 -->
  <section class="p-5 bg-gradient-to-br from-rose-50 to-orange-50 text-center">
    <span class="text-xs font-bold text-rose-500 bg-rose-100 px-2.5 py-1 rounded-full">싸우지 않고 사랑하는 법</span>
    <h2 class="text-xl font-extrabold mt-2 text-slate-900 leading-snug">오늘 우리, 왜 다퉜을까?<br>감성 심리 솔루션</h2>
    <p class="text-xs text-slate-500 mt-1">서운한 마음은 풀고, 서로를 채워주는 커플 공략집</p>
    
    <div class="mt-4">
      <a id="heroAppBtn" href="#" target="_blank" class="inline-block w-full bg-slate-900 text-white text-sm font-bold py-3 rounded-xl shadow-md hover:bg-slate-800 transition">
        💘 [그날의 남녀] 우리 커플 관계 점수 측정하기
      </a>
    </div>
  </section>

  <!-- 메인 콘텐츠 영역 -->
  <main class="max-w-md mx-auto p-4 space-y-6">
    <!-- 심리 상담 및 상품 리스트 -->
    <div id="counselingList" class="space-y-6">
      <!-- JavaScript로 데이터가 자동 삽입됩니다 -->
    </div>

    <!-- 중간 아브아르 광고 배너 -->
    <div class="bg-gradient-to-r from-pink-100 to-rose-100 p-5 rounded-2xl border border-pink-200 shadow-sm text-center">
      <span class="text-[10px] bg-white text-pink-600 px-2 py-0.5 rounded font-bold uppercase tracking-wider">Sponsored</span>
      <h3 id="midBannerTitle" class="font-bold text-slate-900 mt-2">화해 데이트 때 뭐 입지?</h3>
      <p id="midBannerDesc" class="text-xs text-slate-600 mt-1">아브아르(AVOIR)에서 제안하는 감성 데이트 룩북</p>
      <a id="midBannerBtn" href="#" target="_blank" class="mt-3 inline-block bg-pink-500 text-white text-xs font-bold px-4 py-2 rounded-lg shadow hover:bg-pink-600 transition">
        아브아르 룩북 보러가기
      </a>
    </div>
  </main>

  <script>
    // 1. Config 데이터 로드 (광고/링크)
    fetch('./data/config.json')
      .then(res => res.json())
      .then(config => {
        document.getElementById('topBannerText').innerText = config.ads.topBanner.text;
        document.getElementById('topBannerLink').href = config.ads.topBanner.linkUrl;
        
        document.getElementById('youtubeBtn').href = config.youtubeUrl;
        document.getElementById('blogBtn').href = config.blogUrl;
        document.getElementById('appBtn').href = config.coupleScoreAppUrl;
        document.getElementById('heroAppBtn').href = config.coupleScoreAppUrl;

        document.getElementById('midBannerTitle').innerText = config.ads.middleBanner.title;
        document.getElementById('midBannerDesc').innerText = config.ads.middleBanner.description;
        document.getElementById('midBannerBtn').href = config.ads.middleBanner.linkUrl;
        document.getElementById('midBannerBtn').innerText = config.ads.middleBanner.buttonText;
      });

    // 2. Counseling 데이터 로드 (심리상담 + 쿠팡)
    fetch('./data/counseling.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('counselingList');
        container.innerHTML = data.map(item => `
          <article class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
            <div class="flex items-center justify-between text-xs">
              <span class="bg-rose-50 text-rose-600 font-bold px-2.5 py-0.5 rounded-full">#${item.category}</span>
              <span class="text-slate-400 font-medium">${item.topic}</span>
            </div>
            
            <h3 class="font-bold text-base text-slate-900">Q. ${item.situation}</h3>
            
            <div class="bg-slate-50 p-3 rounded-xl border-l-4 border-rose-400 text-xs text-slate-600 leading-relaxed">
              <p class="font-bold text-rose-500 mb-1">💡 심리 팁</p>
              ${item.psychologyAdvice}
            </div>

            <!-- 쿠팡 아이템 카드 -->
            <div class="pt-2 border-t border-slate-100 flex items-center gap-3">
              <img src="${item.product.imageUrl}" alt="상품 이미지" class="w-16 h-16 rounded-lg object-cover border">
              <div class="flex-1 min-w-0">
                <p class="text-xs font-bold text-slate-800 truncate">${item.product.title}</p>
                <p class="text-[11px] text-slate-500 line-clamp-1 mt-0.5">${item.product.description}</p>
                <a href="${item.product.coupangUrl}" target="_blank" class="mt-1.5 inline-flex items-center gap-1 text-[11px] font-bold text-rose-600 hover:underline">
                  화해 솔루션 아이템 보기 <i class="fa-solid fa-arrow-right text-[9px]"></i>
                </a>
              </div>
            </div>
          </article>
        `).join('');
      });
  </script>
</body>
</html>
