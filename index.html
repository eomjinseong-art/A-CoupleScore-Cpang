<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그날의 남녀 - 커플 솔루션 마켓</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 pb-24">

  <!-- 1. 최상단 배너 (아브아르) -->
  <div class="bg-rose-500 text-white text-xs font-semibold py-2 px-4 text-center sticky top-0 z-50 shadow-md">
    <a id="topBannerLink" href="https://www.avoir24.com" target="_blank" class="hover:underline flex items-center justify-center gap-1">
      <span>남친 심쿵하게 만드는 데이트룩 👗 아브아르 바로가기</span> <i class="fa-solid fa-chevron-right text-[10px]"></i>
    </a>
  </div>

  <!-- 2. 헤더 -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-[32px] z-40 shadow-sm">
    <h1 class="font-bold text-lg text-rose-600 flex items-center gap-1.5">
      <i class="fa-solid fa-heart"></i> 그날의 남녀 <span class="text-xs font-normal text-slate-400">Market</span>
    </h1>
    <div class="flex items-center gap-2.5 text-sm">
      <a href="https://www.youtube.com/@SpillEnglish-j9b" target="_blank" class="text-red-500 hover:opacity-80" title="유튜브"><i class="fa-brands fa-youtube text-lg"></i></a>
      <a href="https://couplescore-auto.blogspot.com/" target="_blank" class="text-orange-500 hover:opacity-80" title="블로그"><i class="fa-solid fa-blog text-lg"></i></a>
      <a href="https://couple-score.vercel.app/" target="_blank" class="bg-rose-500 text-white text-[11px] px-2.5 py-1 rounded-full font-bold shadow-sm hover:bg-rose-600">관계진단</a>
    </div>
  </header>

  <!-- 3. 카테고리 필터 바 (감성 상황별 태그) -->
  <nav id="categoryNav" class="bg-white px-4 py-2.5 border-b border-slate-200 overflow-x-auto whitespace-nowrap flex gap-2 text-xs font-medium no-scrollbar">
    <button onclick="filterCategory('전체')" class="px-3 py-1.5 rounded-full bg-slate-900 text-white font-bold">전체보기</button>
    <button onclick="filterCategory('화해할때')" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-600">💖 #화해할때</button>
    <button onclick="filterCategory('싸웠을때')" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-600">⚡ #싸웠을때</button>
    <button onclick="filterCategory('집데이트')" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-600">🏠 #집데이트</button>
    <a href="https://www.avoir24.com" target="_blank" class="px-3 py-1.5 rounded-full bg-pink-100 text-pink-700 font-bold hover:bg-pink-200">👗 데이트룩/선물(아브아르)</a>
  </nav>

  <!-- 4. 공정위 & 쿠팡 파트너스 법적 고지 배너 -->
  <div class="max-w-md mx-auto px-3 pt-3">
    <div class="bg-slate-200/70 border border-slate-300/80 rounded-xl px-3 py-2 text-center">
      <p class="text-[10px] text-slate-600 font-medium leading-tight">
        📢 이 사이트는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
      </p>
    </div>
  </div>

  <!-- 5. 메인 2열 상품 격자 (Grid) -->
  <main class="max-w-md mx-auto p-3">
    <div id="productGrid" class="grid grid-cols-2 gap-3">
      <!-- JS 데이터 로딩 -->
    </div>

    <!-- 중간 아브아르 스폰서 배너 -->
    <div class="mt-4 bg-gradient-to-r from-pink-500 to-rose-500 text-white p-4 rounded-2xl shadow-sm text-center">
      <span class="text-[9px] bg-white/20 px-2 py-0.5 rounded font-bold uppercase">Sponsored</span>
      <h3 class="font-bold text-sm mt-1">화해 데이트 때 뭐 입지? ✨</h3>
      <p class="text-[11px] text-pink-100 mt-0.5">아브아르(AVOIR) 여성의류 감성 큐레이션</p>
      <a href="https://www.avoir24.com" target="_blank" class="mt-2 inline-block bg-white text-rose-600 text-xs font-bold px-3 py-1.5 rounded-lg shadow hover:bg-pink-50">
        아브아르 룩북 구경하기
      </a>
    </div>
  </main>

  <!-- 6. 하단 고정 바로가기 메뉴 바 -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-2 z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1.5 text-center">
      <a href="https://www.youtube.com/@SpillEnglish-j9b" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 transition">
        <i class="fa-brands fa-youtube text-base mb-0.5"></i>
        <span class="text-[10px] font-bold">유튜브</span>
      </a>
      <a href="https://couplescore-auto.blogspot.com/" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-orange-50 text-orange-600 rounded-xl hover:bg-orange-100 transition">
        <i class="fa-solid fa-blog text-base mb-0.5"></i>
        <span class="text-[10px] font-bold">블로그</span>
      </a>
      <a href="https://www.threads.net/@couplescroe" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200 transition">
        <svg class="w-4 h-4 mb-0.5 fill-current" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
          <path d="M141.537 88.9883C140.71 88.5919 139.87 88.2104 139.019 87.8451C137.537 60.5382 122.616 44.005 96.28 44.005C69.9439 44.005 50.5851 63.8016 50.5851 96.0825C50.5851 128.363 69.9439 148.16 96.28 148.16C117.84 148.16 132.899 135.539 137.524 116.326H119.57C115.918 126.177 107.039 131.85 96.28 131.85C80.2016 131.85 68.3297 117.801 68.3297 96.0825C68.3297 74.3643 80.2016 60.315 96.28 60.315C112.358 60.315 120.73 71.4938 121.758 90.738C113.882 89.288 105.15 89.5147 96.28 91.5999C79.8051 95.4851 68.6189 104.996 68.6189 119.231C68.6189 131.944 78.7891 140.354 92.5186 140.354C108.629 140.354 119.141 129.431 121.284 114.39C124.975 117.476 129.351 119.782 134.195 121.054C131.137 139.117 116.162 153.308 96.28 153.308C66.8378 153.308 43.149 129.278 43.149 96.0825C43.149 62.8872 66.8378 38.8572 96.28 38.8572C125.722 38.8572 145.249 58.7497 145.249 96.0825C145.249 104.281 144.159 111.83 142.148 118.665H160.292C162.247 111.583 163.28 104.032 163.28 96.0825C163.28 50.8437 137.28 22 96.28 22C55.28 22 29.28 50.8437 29.28 96.0825C29.28 141.321 55.28 170.165 96.28 170.165C122.951 170.165 145.385 152.122 152.333 126.861C154.551 118.791 155.602 110.155 155.602 101.127C155.602 96.9535 150.866 93.5855 141.537 88.9883ZM94.394 125.071C86.7214 125.071 81.6508 120.89 81.6508 113.805C81.6508 105.748 88.7997 100.279 100.082 97.6256C105.719 96.2996 111.458 95.8239 116.899 96.241C115.86 114.072 107.039 125.071 94.394 125.071Z"/>
        </svg>
        <span class="text-[10px] font-bold">스레드</span>
      </a>
      <a href="https://couple-score.vercel.app/" target="_blank" class="flex flex-col items-center justify-center py-1.5 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition">
        <i class="fa-solid fa-heart-pulse text-base mb-0.5"></i>
        <span class="text-[10px] font-bold">관계진단</span>
      </a>
    </div>
  </footer>

  <script>
    let allProducts = [];

    async function loadData() {
      const paths = ['./data/counseling.json', './counseling.json', 'counseling.json'];
      let loaded = false;

      for (let path of paths) {
        try {
          let res = await fetch(path);
          if (res.ok) {
            allProducts = await res.json();
            renderProducts(allProducts);
            loaded = true;
            break;
          }
        } catch(e) {}
      }

      if (!loaded || allProducts.length === 0) {
        allProducts = [
          {
            category: "화해할때",
            psychologyAdvice: "소소한 다툼은 비난보다 도구를 바꾸는 게 훨씬 평화롭습니다.",
            product: { title: "2080 핑크솔트 펌핑치약", description: "튜브 짜개 싸움 방지 펌핑 치약", coupangUrl: "https://link.coupang.com/a/gJApa05FrU", imageUrl: "https://images.unsplash.com/photo-1559598467-f8b76c8155d0?w=500" }
          },
          {
            category: "싸웠을때",
            psychologyAdvice: "답장이 늦을 땐 비난보다 서운했던 마음을 부드럽게 전해보세요.",
            product: { title: "너와 나의 커플 소통 다이어리", description: "서로의 속마음을 알아가는 질문 문답집", coupangUrl: "https://link.coupang.com/a/gJAqET8o8q", imageUrl: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500" }
          }
        ];
        renderProducts(allProducts);
      }
    }

    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = items.map(item => {
        const title = item.product ? item.product.title : '커플 추천 아이템';
        const desc = item.product ? item.product.description : '관계 개선 필수 아이템';
        const img = (item.product && item.product.imageUrl) ? item.product.imageUrl : 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500';
        const url = item.product ? item.product.coupangUrl : 'https://www.coupang.com';
        const advice = item.psychologyAdvice ? item.psychologyAdvice : '서로의 마음을 부드럽게 표현해보세요.';
        const categoryTag = item.category || '커플';

        return `
          <a href="${url}" target="_blank" class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between hover:border-rose-400 hover:shadow-md transition">
            <div>
              <div class="relative">
                <img src="${img}" alt="상품" class="w-full h-32 object-cover">
                <span class="absolute top-2 left-2 bg-black/65 text-white text-[9px] px-2 py-0.5 rounded-md font-bold backdrop-blur-sm">#${categoryTag}</span>
              </div>
              <div class="p-2.5">
                <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${title}</h4>
                <p class="text-[10px] text-slate-500 line-clamp-1 mt-0.5">${desc}</p>
                
                <div class="mt-2 bg-rose-50 p-1.5 rounded-lg border border-rose-100">
                  <p class="text-[9px] text-rose-600 font-bold leading-tight line-clamp-2">💡 ${advice}</p>
                </div>
              </div>
            </div>
            <div class="p-2.5 pt-0">
              <div class="w-full bg-rose-500 text-white text-[10px] font-bold py-2 rounded-lg text-center shadow-sm hover:bg-rose-600 flex items-center justify-center gap-1">
                <span>쿠팡에서 보기</span> <i class="fa-solid fa-arrow-right text-[8px]"></i>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    function filterCategory(cat) {
      if(cat === '전체') {
        renderProducts(allProducts);
      } else {
        const filtered = allProducts.filter(item => item.category === cat || item.category === ('#' + cat));
        renderProducts(filtered);
      }
    }

    loadData();
  </script>
</body>
</html>
